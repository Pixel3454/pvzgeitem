name: 构建 pvzgeitem

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'

      - name: 切换官方仓库并固定版本号
        run: |
          sed -i "/bmclapi\|forgecdn\|nyist\|zju.edu.cn\|sjtu.edu.cn/d" build.gradle settings.gradle
          if [ -f src/main/resources/META-INF/neoforge.mods.toml ]; then
            sed -i 's/${file.jarVersion}/1.0.0/g' src/main/resources/META-INF/neoforge.mods.toml
          fi

      - name: 编译
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee /tmp/pvzgeitem-build.log

      - name: 把编译报错写到运行摘要
        if: failure()
        run: |
          {
            echo '### 编译报错（复制下面整段发给元宝）'
            echo '```'
            grep -nE 'error:|FAILURE:|What went wrong|FAILED|cannot find symbol|does not exist|不兼容的类型|找不到符号' /tmp/pvzgeitem-build.log | head -60 || true
            echo '```'
            echo ''
            echo '### 日志最后 50 行'
            echo '```'
            tail -50 /tmp/pvzgeitem-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: pvzgeitem-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
