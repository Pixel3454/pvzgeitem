# 把源码推到 GitHub 后自动编译出 jar
# 注意：仓库里没有 gradlew 脚本，所以这里直接调用 GitHub 服务器上的 gradle 命令
name: 构建 pvzgeitem

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 指定 Gradle 8.8 并加入 PATH，同时开启依赖缓存（第二次起会快很多）
      - name: 安装 Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # GitHub 服务器在境外，访问国内镜像反而慢，这一步只在 CI 上移除镜像行
      # 本地文件不受影响，你电脑/手机上仍然用国内镜像
      - name: 切换为官方仓库
        run: sed -i "/bmclapi\|forgecdn\|nyist\|zju.edu.cn\|sjtu.edu.cn/d" build.gradle settings.gradle

      - name: 编译 jar
        run: gradle build --no-daemon --stacktrace

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvzgeitem-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # 打 v 开头的标签时，把 jar 挂到 Release 上
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/pvzgeitem-1.0.0.jar
